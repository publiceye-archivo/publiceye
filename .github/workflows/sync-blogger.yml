name: Sync Blogger issues

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public Blogger posts
        run: node scripts/sync-blogger.mjs
      - name: Commit updated issue data
        run: |
          if git diff --quiet -- data/blog-posts.json; then
            echo "No Blogger changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blog-posts.json
          git commit -m "Sync Blogger issues"
          git push
